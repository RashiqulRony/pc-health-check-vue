sonar.projectKey=PC-Health-Check-Vue
sonar.projectName=PC Health Check Vue
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src

sonar.test.inclusions=src/**/*.test.js,src/**/*.spec.js,src/**/*.test.ts,src/**/*.spec.ts

sonar.exclusions=src/**/*.test.js,src/**/*.spec.js,src/**/*.test.ts,src/**/*.spec.ts,node_modules/**,dist/**,coverage/**

sonar.coverage.exclusions=src/main.js,src/router/**,src/**/*.test.js,src/**/*.spec.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
